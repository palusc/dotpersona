name: validate personas

on:
  push:
    branches: [main]
    paths: ['skills/**', 'custom-personas/**', 'scripts/**', 'plugin.json', '.github/workflows/validate.yml']
  pull_request:
    paths: ['skills/**', 'custom-personas/**', 'templates/**', 'scripts/**', 'plugin.json']

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate persona schema
        run: bash scripts/validate-personas.sh
